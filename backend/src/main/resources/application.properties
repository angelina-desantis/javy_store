spring.application.name=backend

spring.config.import=optional:file:.env[.properties]

logging.level.org.springframework.security=DEBUG

# Server
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL}

# Security
security.jwt-expiration=3600000
security.jwt-secret=${JWT_SECRET}

# IGDB
igdb.client-id=${IGDB_CLIENT_ID}
igdb.client-secret=${IGDB_CLIENT_SECRET}
igdb.base-url=https://api.igdb.com/v4
igdb.auth-url=https://id.twitch.tv/oauth2/token
igdb.import.platform.enabled=false
igdb.import.genre.enabled=false
igdb.import.theme.enabled=false

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=600000

# Frontend
app.frontend.base-url = ${FRONTEND_BASE_URL}

# Swagger
springdoc.api-docs.path = /public/api-docs
springdoc.swagger-ui.path = /public/custom.html